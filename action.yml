name: Calculadora Edad
description: Calcular edad desde año nacimiento
inputs:
  anio_nacimiento:
    description: Año de nacimiento
    required: true
outputs:
  edad:
    description: Edad calculada
    value: ${{ steps.calcular.outputs.edad }}
runs:
  using: composite
  steps:
    - id: calcular
      shell: bash
      env:
        ANIO_NACIMIENTO: ${{ inputs.anio_nacimiento }}
      run: |
        ANIO_ACTUAL=$(date +%Y)
        EDAD=$((ANIO_ACTUAL - ANIO_NACIMIENTO))
        echo "edad=$EDAD" >> "$GITHUB_OUTPUT"
        echo "Edad calculada: $EDAD"
